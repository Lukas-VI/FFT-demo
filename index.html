<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>图像 → 频谱 · FFT 在线演示</title>
<style>
  *{box-sizing:border-box}
  body{
    margin:0;padding:24px;background:#0e1220;color:#e8edf7;
    font-family:"Segoe UI","Microsoft YaHei",system-ui,sans-serif;
  }
  h1{text-align:center;font-size:22px;margin:0 0 8px;font-weight:700}
  h1 span{color:#4f8cff}
  .subtitle{text-align:center;color:#9aa7c4;font-size:13px;margin:0 0 24px}
  .container{
    display:grid;grid-template-columns:repeat(3,1fr);gap:20px;
    max-width:1200px;margin:0 auto;
  }
  .panel{
    background:#1a2238;border:1px solid #2c3857;border-radius:12px;padding:16px;
  }
  .panel h2{
    font-size:14px;margin:0 0 12px;color:#6fe3c1;font-weight:600;
    display:flex;align-items:center;gap:8px;
  }
  .panel h2 .num{
    background:linear-gradient(135deg,#4f8cff,#9b7bff);
    width:20px;height:20px;border-radius:6px;
    display:inline-flex;align-items:center;justify-content:center;
    font-size:11px;color:#fff;
  }
  canvas{
    width:100%;aspect-ratio:1;background:#0b0f1b;border-radius:8px;
    display:block;image-rendering:pixelated;
  }
  .hint{font-size:12px;color:#9aa7c4;margin:10px 0 0;line-height:1.6}
  .controls{margin-top:14px}
  .controls label{display:block;font-size:12.5px;color:#9aa7c4;margin-bottom:6px}
  select, input[type=range]{
    width:100%;background:#212b47;color:#e8edf7;border:1px solid #2c3857;
    border-radius:6px;padding:7px 10px;font-size:13px;font-family:inherit;
  }
  input[type=range]{padding:0;height:6px;-webkit-appearance:none;appearance:none;background:#212b47;border-radius:3px;margin-top:4px}
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;width:16px;height:16px;border-radius:50%;
    background:#4f8cff;cursor:pointer;box-shadow:0 0 0 3px rgba(79,140,255,.25);
  }
  input[type=file]{font-size:12px;color:#9aa7c4;margin-top:12px;width:100%}
  .val{color:#4f8cff;font-weight:600}
  .chip{
    display:inline-block;font-size:11px;padding:2px 8px;border-radius:999px;
    background:rgba(79,140,255,.12);color:#8fb4ff;border:1px solid rgba(79,140,255,.3);
    margin-left:6px;
  }
  .preset-grid{
    display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:10px;
  }
  .preset-btn{
    background:#212b47;color:#e8edf7;border:1px solid #2c3857;border-radius:8px;
    padding:8px 10px;font-size:12.5px;cursor:pointer;text-align:left;
    font-family:inherit;transition:all .15s;
  }
  .preset-btn:hover{border-color:#4f8cff;background:#253157}
  .preset-btn.active{border-color:#4f8cff;background:rgba(79,140,255,.18)}
  .preset-btn .t{font-weight:600;display:block;margin-bottom:2px}
  .preset-btn .d{color:#9aa7c4;font-size:11px}
  .divider{
    text-align:center;color:#5c6b8a;font-size:11px;margin:14px 0 4px;
    position:relative;
  }
  .divider::before,.divider::after{
    content:"";position:absolute;top:50%;width:38%;height:1px;background:#2c3857;
  }
  .divider::before{left:0}
  .divider::after{right:0}
  @media(max-width:860px){
    .container{grid-template-columns:1fr}
  }
</style>
</head>
<body>

<h1>图像 → <span>频谱</span> · 在线 FFT 演示</h1>
<p class="subtitle">选一个预设，看它在频域里长什么样。中心=低频，边缘=高频。</p>

<div class="container">

  <div class="panel">
    <h2><span class="num">1</span>原图 · 空间域</h2>
    <canvas id="original"></canvas>

    <div class="divider">预设图例</div>
    <div class="preset-grid" id="presetGrid"></div>

    <div class="divider">或上传自己的图</div>
    <input type="file" id="upload" accept="image/*">
    <p class="hint">上传或拖拽图片，自动缩放到 256×256。</p>
  </div>

  <div class="panel">
    <h2><span class="num">2</span>频谱 · 频域</h2>
    <canvas id="spectrum"></canvas>
    <p class="hint" id="spectrumHint">
      中心最亮 = 低频（整体亮度、色调）<br>
      四周亮 = 高频（边缘、纹理、噪声）
    </p>
  </div>

  <div class="panel">
    <h2><span class="num">3</span>滤波重建</h2>
    <canvas id="filtered"></canvas>
    <div class="controls">
      <label>滤波器</label>
      <select id="filterType">
        <option value="lowpass">低通 · 只留低频 → 模糊</option>
        <option value="highpass">高通 · 只留高频 → 边缘</option>
        <option value="bandpass">带通 · 留中间一段</option>
        <option value="none">无滤波 · 原样重建</option>
      </select>
      <label style="margin-top:12px">截止半径 <span class="val" id="radiusVal">40</span></label>
      <input type="range" id="radius" min="1" max="180" value="40">
    </div>
  </div>

</div>

<script>
/* ============================================================
   Cooley-Tukey 基-2 FFT
   ============================================================ */
function fft1d(re, im, inverse) {
  const n = re.length;
  for (let i = 1, j = 0; i < n; i++) {
    let bit = n >> 1;
    for (; j & bit; bit >>= 1) j ^= bit;
    j ^= bit;
    if (i < j) {
      let t = re[i]; re[i] = re[j]; re[j] = t;
      t = im[i]; im[i] = im[j]; im[j] = t;
    }
  }
  for (let len = 2; len <= n; len <<= 1) {
    const ang = (inverse ? 2 : -2) * Math.PI / len;
    const wRe = Math.cos(ang), wIm = Math.sin(ang);
    const half = len >> 1;
    for (let i = 0; i < n; i += len) {
      let curRe = 1, curIm = 0;
      for (let j = 0; j < half; j++) {
        const i1 = i + j, i2 = i + j + half;
        const uRe = re[i1], uIm = im[i1];
        const vRe = re[i2] * curRe - im[i2] * curIm;
        const vIm = re[i2] * curIm + im[i2] * curRe;
        re[i1] = uRe + vRe; im[i1] = uIm + vIm;
        re[i2] = uRe - vRe; im[i2] = uIm - vIm;
        const nr = curRe * wRe - curIm * wIm;
        const ni = curRe * wIm + curIm * wRe;
        curRe = nr; curIm = ni;
      }
    }
  }
  if (inverse) {
    for (let i = 0; i < n; i++) { re[i] /= n; im[i] /= n; }
  }
}

function fft2d(re, im, w, h, inverse) {
  const rowRe = new Float32Array(w);
  const rowIm = new Float32Array(w);
  for (let y = 0; y < h; y++) {
    const off = y * w;
    for (let x = 0; x < w; x++) { rowRe[x] = re[off + x]; rowIm[x] = im[off + x]; }
    fft1d(rowRe, rowIm, inverse);
    for (let x = 0; x < w; x++) { re[off + x] = rowRe[x]; im[off + x] = rowIm[x]; }
  }
  const colRe = new Float32Array(h);
  const colIm = new Float32Array(h);
  for (let x = 0; x < w; x++) {
    for (let y = 0; y < h; y++) { colRe[y] = re[y * w + x]; colIm[y] = im[y * w + x]; }
    fft1d(colRe, colIm, inverse);
    for (let y = 0; y < h; y++) { re[y * w + x] = colRe[y]; im[y * w + x] = colIm[y]; }
  }
}

/* ============================================================
   状态
   ============================================================ */
const SIZE = 256;
const state = {
  size: SIZE,
  fftRe: [null, null, null],
  fftIm: [null, null, null],
  spectrum: null,
};

const originalCanvas = document.getElementById('original');
const spectrumCanvas = document.getElementById('spectrum');
const filteredCanvas = document.getElementById('filtered');

function prepCanvas(canvas, size) {
  canvas.width = size;
  canvas.height = size;
  return canvas.getContext('2d');
}

/* ============================================================
   加载图像 → 前向 FFT
   ============================================================ */
function loadImage(img) {
  const size = state.size;
  const tmp = document.createElement('canvas');
  tmp.width = size; tmp.height = size;
  const tctx = tmp.getContext('2d');
  tctx.drawImage(img, 0, 0, size, size);

  prepCanvas(originalCanvas, size);
  originalCanvas.getContext('2d').drawImage(tmp, 0, 0);

  const data = tctx.getImageData(0, 0, size, size).data;
  const total = size * size;

  for (let c = 0; c < 3; c++) {
    const re = new Float32Array(total);
    const im = new Float32Array(total);
    for (let i = 0; i < total; i++) re[i] = data[i * 4 + c] / 255;
    fft2d(re, im, size, size, false);
    state.fftRe[c] = re;
    state.fftIm[c] = im;
  }

  computeSpectrum();
  renderSpectrum();
  applyFilter();
}

/* ============================================================
   频谱可视化
   ============================================================ */
function computeSpectrum() {
  const size = state.size;
  const total = size * size;
  const spec = new Float32Array(total);
  for (let i = 0; i < total; i++) {
    let sum = 0;
    for (let c = 0; c < 3; c++) {
      const re = state.fftRe[c][i], im = state.fftIm[c][i];
      sum += Math.log(1 + Math.sqrt(re * re + im * im));
    }
    spec[i] = sum / 3;
  }
  let mx = 0;
  for (let i = 0; i < total; i++) if (spec[i] > mx) mx = spec[i];
  if (mx > 0) for (let i = 0; i < total; i++) spec[i] /= mx;
  state.spectrum = spec;
}

function renderSpectrum() {
  const size = state.size;
  const half = size >> 1;
  const ctx = prepCanvas(spectrumCanvas, size);
  const imgData = ctx.createImageData(size, size);
  const spec = state.spectrum;
  for (let y = 0; y < size; y++) {
    for (let x = 0; x < size; x++) {
      const sx = (x + half) % size;
      const sy = (y + half) % size;
      const v = Math.pow(spec[sy * size + sx], 0.65) * 255;
      const idx = (y * size + x) * 4;
      imgData.data[idx] = v;
      imgData.data[idx + 1] = v;
      imgData.data[idx + 2] = v;
      imgData.data[idx + 3] = 255;
    }
  }
  ctx.putImageData(imgData, 0, 0);
}

/* ============================================================
   滤波 + 逆 FFT 重建
   ============================================================ */
function applyFilter() {
  const size = state.size;
  const total = size * size;
  const type = document.getElementById('filterType').value;
  const R = parseFloat(document.getElementById('radius').value);

  const mask = new Float32Array(total);
  for (let y = 0; y < size; y++) {
    for (let x = 0; x < size; x++) {
      const du = Math.min(x, size - x);
      const dv = Math.min(y, size - y);
      const r = Math.sqrt(du * du + dv * dv);
      let m = 0;
      if (type === 'none') m = 1;
      else if (type === 'lowpass') m = r <= R ? 1 : 0;
      else if (type === 'highpass') m = r >= R ? 1 : 0;
      else if (type === 'bandpass') m = (r >= R * 0.5 && r <= R) ? 1 : 0;
      mask[y * size + x] = m;
    }
  }

  const outData = new Uint8ClampedArray(total * 4);
  for (let c = 0; c < 3; c++) {
    const re = new Float32Array(total);
    const im = new Float32Array(total);
    for (let i = 0; i < total; i++) {
      re[i] = state.fftRe[c][i] * mask[i];
      im[i] = state.fftIm[c][i] * mask[i];
    }
    fft2d(re, im, size, size, true);
    for (let i = 0; i < total; i++) {
      outData[i * 4 + c] = Math.max(0, Math.min(255, re[i] * 255));
    }
  }
  for (let i = 0; i < total; i++) outData[i * 4 + 3] = 255;

  const ctx = prepCanvas(filteredCanvas, size);
  const imgData = ctx.createImageData(size, size);
  imgData.data.set(outData);
  ctx.putImageData(imgData, 0, 0);
}

/* ============================================================
   预设图像生成器
   ============================================================ */
const presets = {
  solid: {
    name: '纯色图',
    desc: '频谱仅中心一个亮点（直流）',
    hint: '纯色 = 零频率。FFT 后只有中心（直流分量）是亮的，其余全黑。',
    draw(ctx, size) {
      ctx.fillStyle = '#4f8cff';
      ctx.fillRect(0, 0, size, size);
    }
  },
  gradient: {
    name: '渐变图',
    desc: '低频为主，中心有亮斑',
    hint: '平滑渐变只有低频成分。频谱能量集中在中心，向外迅速衰减。',
    draw(ctx, size) {
      const g = ctx.createLinearGradient(0, 0, size, size);
      g.addColorStop(0, '#1a3a6b');
      g.addColorStop(0.5, '#4f8cff');
      g.addColorStop(1, '#6b3a1a');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, size, size);
    }
  },
  noise: {
    name: '噪点图',
    desc: '频谱全亮，高频也强',
    hint: '随机噪点包含所有频率，频谱几乎均匀铺满，高频（四周）也很亮。',
    draw(ctx, size) {
      const imgData = ctx.createImageData(size, size);
      for (let i = 0; i < size * size; i++) {
        const v = Math.random() * 255;
        imgData.data[i * 4] = v;
        imgData.data[i * 4 + 1] = v;
        imgData.data[i * 4 + 2] = v;
        imgData.data[i * 4 + 3] = 255;
      }
      ctx.putImageData(imgData, 0, 0);
    }
  },
  stripes: {
    name: '周期条纹',
    desc: '频谱出现对称亮点',
    hint: '周期性条纹在频域表现为对称的亮点。条纹越密，亮点离中心越远。',
    draw(ctx, size) {
      ctx.fillStyle = '#0b0f1b';
      ctx.fillRect(0, 0, size, size);
      ctx.fillStyle = '#f0f0f0';
      const period = 16;
      for (let x = 0; x < size; x += period) {
        ctx.fillRect(x, 0, period / 2, size);
      }
    }
  },
  edges: {
    name: '细线条/边缘',
    desc: '频谱呈放射状，高频强',
    hint: '细线条和边缘属于高频。频谱沿线条方向呈放射状亮纹，外围高频区域能量强。',
    draw(ctx, size) {
      ctx.fillStyle = '#0b0f1b';
      ctx.fillRect(0, 0, size, size);
      ctx.strokeStyle = '#f0f0f0';
      ctx.lineWidth = 1;
      for (let i = 0; i < size; i += 8) {
        ctx.beginPath();
        ctx.moveTo(i, 0);
        ctx.lineTo(i, size);
        ctx.stroke();
      }
      for (let i = 0; i < size; i += 8) {
        ctx.beginPath();
        ctx.moveTo(0, i);
        ctx.lineTo(size, i);
        ctx.stroke();
      }
    }
  },
  shapes: {
    name: '几何形状',
    desc: '低频+中频混合',
    hint: '背景（低频）+ 方块/圆（中频边缘）的混合频谱。低频集中中心，中频分布在中间环带。',
    draw(ctx, size) {
      const g = ctx.createLinearGradient(0, 0, size, size);
      g.addColorStop(0, '#1a3a6b');
      g.addColorStop(1, '#6b3a1a');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, size, size);

      ctx.fillStyle = '#f0f0f0';
      ctx.fillRect(40, 40, 60, 60);
      ctx.fillRect(150, 100, 70, 70);

      ctx.fillStyle = '#4f8cff';
      ctx.beginPath();
      ctx.arc(170, 180, 40, 0, Math.PI * 2);
      ctx.fill();
    }
  }
};

/* ============================================================
   预设按钮 UI
   ============================================================ */
const presetGrid = document.getElementById('presetGrid');
let activePreset = null;

for (const key in presets) {
  const p = presets[key];
  const btn = document.createElement('button');
  btn.className = 'preset-btn';
  btn.dataset.key = key;
  btn.innerHTML = `<span class="t">${p.name}</span><span class="d">${p.desc}</span>`;
  btn.addEventListener('click', () => selectPreset(key));
  presetGrid.appendChild(btn);
}

function selectPreset(key) {
  activePreset = key;
  document.querySelectorAll('.preset-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.key === key);
  });
  const p = presets[key];
  const size = state.size;
  const tmp = document.createElement('canvas');
  tmp.width = size; tmp.height = size;
  const tctx = tmp.getContext('2d');
  p.draw(tctx, size);
  document.getElementById('spectrumHint').innerHTML = p.hint;
  const img = new Image();
  img.onload = () => loadImage(img);
  img.src = tmp.toDataURL();
}

/* ============================================================
   事件绑定
   ============================================================ */
document.getElementById('upload').addEventListener('change', (e) => {
  const f = e.target.files[0];
  if (!f) return;
  const img = new Image();
  img.onload = () => {
    activePreset = null;
    document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
    loadImage(img);
  };
  img.src = URL.createObjectURL(f);
});

document.getElementById('filterType').addEventListener('change', applyFilter);

let pending = false;
document.getElementById('radius').addEventListener('input', (e) => {
  document.getElementById('radiusVal').textContent = e.target.value;
  if (pending) return;
  pending = true;
  requestAnimationFrame(() => { applyFilter(); pending = false; });
});

document.addEventListener('dragover', (e) => e.preventDefault());
document.addEventListener('drop', (e) => {
  e.preventDefault();
  const f = e.dataTransfer.files[0];
  if (f && f.type.startsWith('image/')) {
    const img = new Image();
    img.onload = () => {
      activePreset = null;
      document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
      loadImage(img);
    };
    img.src = URL.createObjectURL(f);
  }
});

/* ============================================================
   初始
   ============================================================ */
selectPreset('shapes');
</script>
</body>
</html>
